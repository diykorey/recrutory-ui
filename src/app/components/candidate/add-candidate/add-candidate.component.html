<div class="add-candidate-container">
  <h1>{{ isEditMode ? 'Edit Candidate' : 'Add New Candidate' }}</h1>

  <form [formGroup]="candidateForm" (ngSubmit)="onSubmit()" class="candidate-form">
    <mat-card>
      <mat-card-content>
        <div class="form-row">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Full Name</mat-label>
            <input matInput formControlName="name" placeholder="Enter full name">
            <mat-error *ngIf="candidateForm.get('name')?.hasError('required')">
              Name is required
            </mat-error>
            <mat-error *ngIf="candidateForm.get('name')?.hasError('minlength')">
              Name must be at least 2 characters long
            </mat-error>
          </mat-form-field>
        </div>

        <div class="form-row">
          <mat-form-field appearance="outline" class="half-width">
            <mat-label>Email</mat-label>
            <input matInput formControlName="email" type="email" placeholder="Enter email address">
            <mat-error *ngIf="candidateForm.get('email')?.hasError('required')">
              Email is required
            </mat-error>
            <mat-error *ngIf="candidateForm.get('email')?.hasError('email')">
              Please enter a valid email address
            </mat-error>
          </mat-form-field>

          <mat-form-field appearance="outline" class="half-width">
            <mat-label>Phone</mat-label>
            <input matInput formControlName="phone" placeholder="Enter phone number">
            <mat-error *ngIf="candidateForm.get('phone')?.hasError('required')">
              Phone number is required
            </mat-error>
          </mat-form-field>
        </div>

        <div class="form-row">
          <mat-form-field appearance="outline" class="half-width">
            <mat-label>Position</mat-label>
            <input matInput formControlName="position" placeholder="Enter desired position">
            <mat-error *ngIf="candidateForm.get('position')?.hasError('required')">
              Position is required
            </mat-error>
          </mat-form-field>

          <mat-form-field appearance="outline" class="half-width">
            <mat-label>Status</mat-label>
            <mat-select formControlName="status">
              <mat-option *ngFor="let status of statusOptions" [value]="status.value">
                {{ status.label }}
              </mat-option>
            </mat-select>
          </mat-form-field>
        </div>

        <div class="form-row">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Experience</mat-label>
            <textarea matInput formControlName="experience" rows="3" placeholder="Enter work experience"></textarea>
          </mat-form-field>
        </div>

        <div class="form-row">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Skills</mat-label>
            <textarea matInput formControlName="skills" rows="2" placeholder="Enter skills (comma separated)"></textarea>
          </mat-form-field>
        </div>

        <div class="form-row">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Notes</mat-label>
            <textarea matInput formControlName="notes" rows="3" placeholder="Enter additional notes"></textarea>
          </mat-form-field>
        </div>
      </mat-card-content>

      <mat-card-actions class="form-actions">
        <button mat-raised-button color="primary" type="submit" [disabled]="!candidateForm.valid">
          {{ isEditMode ? 'Update Candidate' : 'Create Candidate' }}
        </button>
        <button mat-button type="button" (click)="onCancel()">
          Cancel
        </button>
      </mat-card-actions>
    </mat-card>
  </form>
</div>
