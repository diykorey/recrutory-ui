<div class="dashboard-container">
  <h1>Recrutory Dashboard</h1>

  <div class="dashboard-cards">
    <mat-card class="dashboard-card" (click)="navigateToVacancies()">
      <mat-card-header>
        <mat-card-title>Vacancies</mat-card-title>
        <mat-card-subtitle>Manage job openings</mat-card-subtitle>
      </mat-card-header>
      <mat-card-content>
        <mat-icon class="dashboard-icon">work</mat-icon>
        <p>View and manage all job vacancies</p>
      </mat-card-content>
      <mat-card-actions>
        <button mat-button (click)="navigateToAddVacancy(); $event.stopPropagation()">Add New</button>
      </mat-card-actions>
    </mat-card>

    <mat-card class="dashboard-card" (click)="navigateToCandidates()">
      <mat-card-header>
        <mat-card-title>Candidates</mat-card-title>
        <mat-card-subtitle>Manage applicants</mat-card-subtitle>
      </mat-card-header>
      <mat-card-content>
        <mat-icon class="dashboard-icon">people</mat-icon>
        <p>View and manage all candidates</p>
      </mat-card-content>
      <mat-card-actions>
        <button mat-button (click)="navigateToAddCandidate(); $event.stopPropagation()">Add New</button>
      </mat-card-actions>
    </mat-card>
  </div>
</div>
