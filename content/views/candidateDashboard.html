<search-view ng-show="searchProcess"></search-view>
<h1>Vacancy Search</h1>
<div ng-controller="candidateCtrl">
	<div class="clearfix" ng-class="currentCandidate ? 'col-side-visible' : ''">
		<div class="col-main">
			<div class="card-list">
				<candidate-card ng-repeat="candidate in candidatesData" class="card-box"></candidate-card>
			</div>
		</div>
		<div class="col-side">
			<md-toolbar md-scroll-shrink>
				<div class="card-info-name">
					<span>{{currentCandidate.summaryCard.name.fieldValue}}</span>
					<!-- <div class="col-lg-1"><span ng-show="currentCandidate.hot == true" class="badge hot">HOT</span></div> -->
				</div>
			</md-toolbar>
			<md-content>
				<div class="card-info">
					<div class="card-info-tabs-nav clearfix">
						<md-tabs md-no-pagination md-selected="selectedIndex" flex>
							<md-tab ng-repeat="tab in tabsCandidateDetails"><a href='javascript:void(0)'>{{tab.heading}}</a> </md-tab>
						</md-tabs>
					</div>
					<!--<div ng-show="updateProcess" class="progress progress-details" style="margin:0px">
						<div class="indeterminate"></div>
					</div>-->
					<div ng-show="selectedIndex == 0">
						<candidate-side-main></candidate-side-main>
					</div>
					<div ng-show="selectedIndex == 1">
						<candidate-side-flow class="flows"></candidate-side-flow>
					</div>
					<div ng-show="selectedIndex == 2">
						<candidate-side-suggestions class="suggestions"></candidate-side-suggestions>
					</div>
					<div ng-show="selectedIndex == 3">
						<notes></notes>
					</div>
				</div>
			</md-content>
		</div>
	</div>
</div>
