<search-view ng-show="searchProcess"></search-view>
<h1>Vacancy Search</h1>
<div ng-controller="vacancyCtrl">
	<div class="clearfix" ng-class="currentVacancy ? 'col-side-visible' : ''">
		<div class="col-main">
			<div class="сard-table">
				<div class="card-table-header">
					<div class="card-table-cell" ng-repeat="item in vacancyTableItems" ng-click="setOrder(item)">{{item}}</div>
				</div>
				<div class="card-table-row" ng-repeat="vacancy in vacanciesData | orderBy: [orderVal.filter] | filter: filterTextName || filterTextEmail" ng-class="vacancy == currentVacancy ? 'selectedTable' : 'none' " ng-click="selectVacancy(vacancy)">
					<div class="card-table-cell card-table-name">{{vacancy.allowArchive ? 'Do you want to archive ' + vacancy.name + ' vacancy ?' : vacancy.name}}</div>
					<div class="card-table-cell card-table-state">
						<span class="open">{{vacancy.state}}</span>
					</div>
					<div class="card-table-cell card-table-icons clearfix">
						<ul class="card-icon-list" ng-hide="vacancy.allowArchive">
							<li>
								<md-button ng-click="quickAction.archive(vacancy,'archive')" class="card-icon-archive" aria-label="refresh">
									<!--<md-tooltip>
										Archive
									</md-tooltip>-->
								</md-button>
							</li>
							<li>
								<md-button ng-hide="currentVacancy" ng-click="quickAction.main(vacancy)" class="card-icon-main" aria-label="refresh">
									<!--<md-tooltip>
										Main
									</md-tooltip>-->
								</md-button>
							</li>
							<li>
								<md-button ng-hide="currentVacancy" ng-click="quickAction.suggestions(vacancy)" class="card-icon-flow" aria-label="refresh">
									<!--<md-tooltip>
										Suggestions
									</md-tooltip>-->
								</md-button>
							</li>
							<li>
								<md-button ng-hide="currentVacancy" ng-click="quickAction.notes(vacancy)" class="card-icon-notes"  aria-label="refresh">
									<!--<md-tooltip>
										Note
									</md-tooltip>-->
								</md-button>
							</li>
                        </ul>
                        <!--<div ng-show="vacancy.allowArchive" class="pull-right">
                            <md-button class="md-raised md-warn" ng-click="archiveVacancy(vacancy)">Archive</md-button>
                            <md-button class="md-raised" ng-click="quickAction.archive(vacancy,'unarchive')">Undo</md-button>
                        </div>-->
						{{vacancy.createTime|date:'shortDate'}}
					</div>
				</div>
			</div>
		</div>
		<div class="col-side">
			<md-toolbar md-scroll-shrink>
				<div class="card-info-name">
					<span>{{currentVacancy.fieldValue}}</span>
					<!-- <div class="col-lg-1"><span ng-show="currentVacancy.hot == true" class="badge hot">HOT</span></div> -->
				</div>
			</md-toolbar>
			<md-content>
				<div class="card-info">
					<div class="card-info-tabs-nav clearfix">
						<md-tabs md-selected="selectedIndex" flex>
							<md-tab ng-repeat="tab in tabsVacancies"><a href='javascript:void(0)'>{{tab.heading}}</a> </md-tab>
						</md-tabs>
					</div>
					<!--<div ng-show="updateProcess" class="progress progress-details" style="margin:0px">
						<div class="indeterminate"></div>
					</div>-->
					<div ng-show="selectedIndex == 0">
						<vacancy-side-main></vacancy-side-main>
					</div>
					<div ng-show="selectedIndex == 1">
						<vacancy-side-flow class="flows"></vacancy-side-flow>
					</div>
					<div ng-show="selectedIndex == 2">
						<vacancy-side-suggestions class="suggestions"></vacancy-side-suggestions>
					</div>
					<div ng-show="selectedIndex == 3">
						<notes></notes>
					</div>
				</div>
			</md-content>
		</div>
	</div>
</div>
