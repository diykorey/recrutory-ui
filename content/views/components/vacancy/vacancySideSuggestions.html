<div>
	<div class="card-info-top clearfix">
		<div class="pull-left">
			<button class="small-button c1" ng-click='sendFlow()' ng-disabled="!flowData.length">+ Add to flow</button>
		</div>
		<label class="pull-right filter-block">
			<input class="textfield filter-input" ng-change="getSuggestions.search()" ng-model="filterSuggestions" placeholder="Filter">
		</label>
	</div>
	<div class="suggestions-box">
		<label ng-if="flowSuggested.length > 0">Suggested: </label>
		<label ng-if="!flowSuggested">Suggested: none</label>
		<div class="suggestions-box-item clearfix" ng-repeat="candidate in flowSuggested">
			<div class="suggestions-box-item-name">
				<md-checkbox class="md-checkbox" ng-model="flowaddModel[candidate.id]" ng-change="changeFlowData(candidate.id)" aria-label="Choose candidate"></md-checkbox>
				<span>{{candidate.summaryCard.name.fieldValue || '&nbsp;&nbsp; * * * *'}}</span>
			</div>
			<div class="suggestions-box-item-text">	<span ng-repeat="tag in candidate.tags" ng-if="candidate.tags.length > 0">
					<a>{{tag.keyword}}</a>{{$last ? '' : ($index==candidate.tags.length-2) ? ' and ' : ', '}}
				</span>
			</div>
		</div>
		<div ng-if="flowSuggested.length > 0">
			<md-button class="suggestions-box-more" ng-click="getSuggestions(suggestedPage,availablePage,'suggested')">More</md-button>
		</div>
	</div>
	<div class="suggestions-box">
		<label ng-if="flowAvailable.length > 0 ">Available:</label>
		<label ng-if="!flowAvailable.length">Available: none</label>
		<div class="suggestions-box-item clearfix" ng-repeat="candidate in flowAvailable">
			<div class="suggestions-box-item-name">
				<md-checkbox class="md-checkbox" ng-model="flowaddModel[candidate.id]" ng-change="changeFlowData(candidate.id)" aria-label="Choose candidate"></md-checkbox>
				<span>{{candidate.summaryCard.name.fieldValue || '&nbsp;&nbsp;* * * *'}}</span>
			</div>
			<div class="suggestions-box-item-text">
				<span ng-repeat="tag in candidate.tags" ng-if="candidate.tags.length > 0">
					<a>{{tag.keyword}}</a>{{$last ? '' : ($index==candidate.tags.length-2) ? ' and ' : ', '}}
				</span>
			</div>
		</div>
		<div ng-if="flowAvailable.length > 0">
			<md-button class="suggestions-box-more"  ng-click="getSuggestions(suggestedPage,availablePage,'available')">More</md-button>
	  </div>
	</div>
</div>
