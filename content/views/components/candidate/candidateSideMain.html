	<div class="closure-wrapper">
		<div class="closure-block" ng-class="hidePredefined ? '' : 'border-visible'">
			<label>Predefined</label>
			<md-button class="{{hidePredefined ? '' : 'opened'}}" ng-click="hidePredefined = !hidePredefined">{{hidePredefined ? 'Show' : 'Hide'}}</md-button>
		</div>
		<!-- PREDEFINED CLOSURE -->
		<div class="closure clearfix" ng-hide="hidePredefined">
			<div class="card-info-main-cv">
				<p>
					<a href="#">CV_URL</a>
				</p>
				<button type="button">+ Add CV</button>
			</div>
			<div class="card-info-main-list">
				<div ng-show="currentCandidate.summaryCard.predefinedFields.length == 0">No results</div>
				<div class="card-info-main-list-item clearfix" ng-repeat="field in currentCandidate.summaryCard.predefinedFields" ng-show="currentCandidate.summaryCard.predefinedFields.length > 0">
					<!--<md-input-container>-->
					<label>{{field.type.name}}</label>
					<input class="textfield" type="text" ng-blur="updateField(field)" ng-focus="customField.set(field)" ng-model="field.fieldValue">
					<!--</md-input-container>-->
				</div>
			</div>
		</div>
		<!-- PRIME -->
		<div class="closure-block" ng-class="hidePrime ? '' : 'border-visible'">
			<label>Prime</label>
			<md-button class="{{hidePrime ? '' : 'opened'}}" ng-click="hidePrime = !hidePrime">{{hidePrime ? 'Show' : 'Hide'}}</md-button>
		</div>
		<!-- PRIME CLOSURE -->
		<div class="closure clearfix" ng-hide="hidePrime">
			<div class="card-info-main-cv">
				<p>
					<a href="#">CV_URL</a>
				</p>
				<button type="button">+ Add CV</button>
			</div>
			<div class="card-info-main-list">
				<div ng-show="currentCandidate.summaryCard.predefinedFields.length == 0">No results</div>
				<div class="card-info-main-list-item clearfix" ng-repeat="field in currentCandidate.summaryCard.customFields" >
					<!--<md-input-container>-->
					<label>{{field.type.name}}</label>
					<input class="textfield" size="" type="text" ng-blur="updateField(field)" ng-focus="customField.set(field)" ng-model="field.fieldValue">
					<!--</md-input-container>-->
					<button type="button" class="edit-icon"></button>
					<md-button class="del-icon" ng-click="customField.delete(field)"></md-button>
				</div>
			</div>
		</div>
		<!-- COMMON -->
		<div class="closure-block" ng-class="hideCustom ? '' : 'border-visible'">
			<label>Common</label>
			<md-button class="{{hideCustom ? '' : 'opened'}}" ng-click="hideCustom = !hideCustom">{{hideCustom ? 'Show' : 'Hide'}}</md-button>
		</div>
		<!-- COMMON CLOSURE -->
		<div class="closure clearfix" ng-hide="hideCustom">
			<div class="card-info-main-cv">
				<p>
					<a href="#">CV_URL</a>
				</p>
				<button type="button">+ Add CV</button>
			</div>
			<div class="card-info-main-list">
				<div ng-show="currentCandidate.summaryCard.predefinedFields.length == 0">No results</div>
				<div class="card-info-main-list-item clearfix" ng-repeat="field in currentCandidate.summaryCard.customFields">
					<!--<md-input-container>-->
					<label>{{field.type.name}}</label>
					<input class="textfield" type="text" ng-blur="updateField(field)" ng-focus="customField.set(field)" ng-model="field.fieldValue">
					<!--</md-input-container>-->
					<button type="button" class="edit-icon"></button>
					<md-button class="del-icon" ng-click="customField.delete(field)"></md-button>
				</div>
			</div>
		</div>
	</div>
	<div class="card-info-main-tags">
		<label>Tags</label>
		<div class="card-info-main-tags-list clearfix" ng-if="currentCandidateData.tags.length > 0">
			<a ng-repeat="tag in currentCandidateData.tags" ng-if="currentCandidateData.tags.length > 0" ng-click="tags.delete(tag)">{{tag.keyword}}</a>
		</div>
		<div class="card-info-main-tags-list" ng-show="currentCandidateData.tags.length == 0">No tags</div>
		<input class="textfield" ng-keyup="$event.keyCode == 13 || $event.keyCode == 32 || $event.keyCode == 188? tags.add() : null" ng-model="tagEdit" placeholder="Type tag name and hit Enter, Space or type comma to add it.">
	</div>
</div>
