<div>
	<div class="card" ng-class="candidate.id == currentCandidate.id ? 'selected' :''">
		<div class="content clearfix">
			<div ng-click="selectCandidate(candidate); fixedAside(candidate.id);" id="card-{{candidate.id}}">
				<!-- Default card content -->
				<!--<div class="col-lg-6 text-center hot" ng-if="candidate.hot == true">HOT</div>-->
				<div class="card-name">{{candidate.summaryCard.name.fieldValue}}</div>
				<div class="card-number clearfix">
					<span>{{candidate.id}}</span>
				</div>
				<div class="card-tags">
					<label>Tags:</label>
					<tag-list tags="candidate.tags"> </tag-list>
				</div>
				<div class="card-date">{{candidate.createTime|date:'medium'}}</div>
				<ul class="card-icon-list">
					<li>
						<md-button ng-click="quickAction.main(candidate)" class="card-icon-main" aria-label="refresh">
							<!--<md-tooltip>
								Main
							</md-tooltip>-->
						</md-button>
					</li>
					<li>
						<md-button ng-click="quickAction.flow(candidate)" class="card-icon-flow" aria-label="refresh">
							<!--<md-tooltip>
								Flow
							</md-tooltip>-->
						</md-button>
					</li>
						<li>
						<md-button ng-click="quickAction.notes(candidate)" class="card-icon-notes" aria-label="refresh">
							<!--<md-tooltip>
								Note
							</md-tooltip>-->
						</md-button>
					</li>
				</ul>
			</div>
			<!-- End Default card content -->
			
		</div>
	</div>
</div>
