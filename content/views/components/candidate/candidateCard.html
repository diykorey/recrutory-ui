<div class="clearfix" ng-class="currentCandidate ? 'col-lg-6' : 'col-lg-3'">

    <div class="content clearfix" ng-click="selectCandidate(candidate)" ng-class="candidate.id == currentCandidate.id ? 'selected' :''">
        <div ng-hide="candidate.allowArchive == true">
            <!-- Default card content -->
            <div class="clearfix">
                <div class="col-lg-4 info-top">
                    <div class="col-lg-6 text-center number">{{candidate.id}}</div>
                    <div class="col-lg-6 text-center hot" ng-if="candidate.hot == true">HOT</div>
                </div>
                <div class="col-lg-8 pull-right clearfix action-btns" style="padding:0">
                    <md-button ng-click="quickAction.main(candidate)" class="md-fab main  pull-right" aria-label="refresh">
                        <md-tooltip>
                            Main
                        </md-tooltip>
                        M
                        </md-icon>
                    </md-button>
                    <md-button ng-click="quickAction.flow(candidate)" class="md-fab flow  pull-right" aria-label="refresh">
                        <md-tooltip>
                            Flow
                        </md-tooltip>
                        F
                        </md-icon>
                    </md-button>
                    <md-button ng-click="quickAction.notes(candidate)" class="md-fab note md-primary pull-right" aria-label="refresh">
                        <md-tooltip>
                            Note
                        </md-tooltip>
                        N
                        </md-icon>
                    </md-button>
                </div>
            </div>
            <div class="name">{{candidate.summaryCard.name.fieldValue}}</div>
            <div class="tags">
                <label>Tags:</label>
                <tag-list tags="candidate.tags"> </tag-list>
            </div>
            <div class="date">{{candidate.createTime|date:'medium'}}</div>
        </div>
        <!-- End Default card content -->
        <div ng-show="candidate.allowArchive == true" class="text-center col-centered col-lg-11 archive-warn-wrapper">
            <!-- Archive card content -->
            <i class="glyphicon glyphicon-trash text-center"></i>
            <p>Are you sure that you want
                <br>to archive this candidate ?
            </p>
            <div class="margin-t-20">
                <md-button class="md-raised md-warn inline" ng-click="archivecandidate(candidate)">ARCHIVE</md-button>
                <md-button ng-click="quickAction.archive(candidate,'unarchive')">UNDO</md-button>
            </div>
        </div>
        <!-- End Archive card content -->
    </div>
