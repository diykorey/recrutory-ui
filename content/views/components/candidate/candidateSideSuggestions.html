<div>
	<div class="card-info-top clearfix">
		<div class="pull-left">
			<button class="small-button c1" ng-click='sendFlow()' ng-disabled="!flowData.length" ng-click="selectedIndex = 2">+ Add to flow</button>
		</div>
		<label class="pull-right filter-block">
			<input class="textfield filter-input" ng-change="getSuggestions.search()" ng-model="filterSuggestions">
			<span>Filter</span>
		</label>
	</div>
	<div class="suggestions-box">
		<label>Suggested :</label>
		<div class="suggestions-box-item clearfix" ng-repeat="vacancy in flowSuggested">
			<div class="suggestions-box-item-name">
				<md-checkbox class="md-checkbox" ng-model="flowaddModel[vacancy.id]" ng-change="changeFlowData(vacancy.id)" aria-label="Checkbox 1"></md-checkbox>
				<span>Vacancy [ {{vacancy.id}} ]</span>
			</div>
			<div class="suggestions-box-item-text">Good english, experience to build highload project, some english, experience to build highload project</div>
		</div>
		<md-button class="suggestions-box-more" ng-click="getSuggestions.suggested(true)">Show</md-button>
	</div>
	<div class="suggestions-box">
		<label>Available :</label>
		<div class="suggestions-box-item clearfix" ng-repeat="vacancy in flowAvailable">
			<div class="suggestions-box-item-name">
				<md-checkbox class="md-checkbox" ng-model="flowaddModel[vacancy.id]" ng-change="changeFlowData(vacancy.id)" aria-label="Checkbox 1"></md-checkbox>
				<span>Vacancy [ {{vacancy.id}} ]</span>
			</div>
			<div class="suggestions-box-item-text">Good english, experience to build highload project, some english, experience to build highload project</div>
		</div>
		<md-button class="suggestions-box-more" ng-click="getSuggestions.available(true)">Show</md-button>
	</div>
</div>
