<h1>Add new vacancy</h1>
<div class="center-box">
	<div class="center-box-text"></div>
	<div class="simple-form">
		<div class="simple-form-field">
			<input type="text" ng-model="vacancy.name" class="textfield" placeholder="Name">
		</div>
		<div class="simple-form-field" style="text-align:left;">

			<md-input-container>
				<textarea ng-model="vacancy.requirements" rows="4" columns="1" md-maxlength="150" class="textarea" ng-attr-placeholder="Requirements" style="width:80%;"></textarea>
			</md-input-container>
			<br>
		</div>
		<div class="simple-form-field">
			<input type="text" ng-model="vacancy.tags" class="textfield" placeholder="Tags">
		</div>
		<div class="simple-form-button">

			<md-button ng-click="addVacancy()" class="big-button">Add New Vacancy</md-button>
		</div>
