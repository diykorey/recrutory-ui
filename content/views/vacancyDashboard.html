<search-view ng-show="searchProcess"></search-view>
<div class="clearfix card-view" ng-controller="vacancyCtrl">
    <!-- Dashboard wrapper  -->
    <div ng-class="{'col-lg-6 no-padding' : currentVacancy}">
        <!-- Vacancy card wrapper | Angular DIRECTIVE-->
        <vacancy-card ng-repeat="vacancy in vacanciesData" class="recrutory-card"></vacancy-card>
    </div>
    <!-- End Vacancy card wrapper  -->
    <div ng-show="currentVacancy" class="side-view" ng-class="currentVacancy ? 'col-lg-6' : 'hide'">
        <!-- Vacancy side menu  -->
        <md-toolbar md-scroll-shrink>
            <!-- Nav Vacancy side menu  -->
            <div class="md-toolbar-tools clearfix">
                <div class="col-md-12"><p class="heading-vacancy-side text-center">{{currentVacancy.name}}</p></div>
                <!-- <div class="col-lg-1"><span ng-show="currentVacancy.hot == true" class="badge hot">HOT</span></div> -->
            </div>
        </md-toolbar>
        <!-- End Nav Vacancy side menu  -->
        <md-content>
            <!-- Content Vacancy side menu  -->
            <div class="wrapper-sidemenu col-centered">
                <!-- Wrapper side menu  -->
                <md-tabs md-selected="selectedIndex" flex>
                    <md-tab ng-repeat="tab in tabsVacancies"><a href='javascript:void(0)'>{{tab.heading}}</a> </md-tab>
                </md-tabs>
                <div ng-show="updateProcess" class="progress progress-details" style="margin:0px">
                    <div class="indeterminate"></div>
                </div>
                <div ng-show="selectedIndex == 0">
                    <vacancy-side-main></vacancy-side-main>
                </div>
                <!-- End tab Main  -->
                <div ng-show="selectedIndex == 1">
                    <vacancy-side-flow class="flows"></vacancy-side-flow>
                </div>
                <div ng-show="selectedIndex == 2">
                    <vacancy-side-suggestions class="suggestions"></vacancy-side-suggestions>
                </div>
                <!-- End tab Suggestions  -->
                <div ng-show="selectedIndex == 3">
                    <notes></notes>
                </div>
                <!-- End tab Notes  -->
            </div>
            <!--  End Wrapper side menu  -->
        </md-content>
        <!-- End Content Vacancy side menu  -->
    </div>
    <!-- Vacancy side menu  -->
</div>
<!-- End Dashboard wrapper  -->
